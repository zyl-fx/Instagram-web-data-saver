name: Update downloads badge

# Adds up GitHub release downloads and Greasy Fork installs once a day and
# stores the total in a small JSON file on a separate "badges" branch.
# The README badge reads that file through shields.io.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    env:
      GREASYFORK_ID: "600943"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count downloads
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          github=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].assets[] | select(.name | endswith(".user.js")) | .download_count' | awk '{s+=$1} END {print s+0}')
          greasy=$(curl -fsSL "https://greasyfork.org/scripts/${GREASYFORK_ID}.json" | jq -er '.total_installs')
          total=$((github + greasy))
          echo "GitHub releases: $github | Greasy Fork: $greasy | total: $total"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Publish badge data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"blue"}\n' "${{ steps.count.outputs.total }}" > downloads.json
          git add downloads.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update downloads badge"
            git push origin HEAD:badges
          fi
