name: Update downloads badge

# Adds up GitHub release downloads and Greasy Fork installs once a day and
# stores the total in a small JSON file on a separate "badges" branch.
# The README badge reads that file through shields.io.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    env:
      GREASYFORK_ID: "600943"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count downloads
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "1/2 Counting GitHub release downloads..."
          if ! raw=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].assets[] | select(.name | endswith(".user.js")) | .download_count'); then
            echo "::error::Could not read the GitHub releases (see the message above)."
            exit 1
          fi
          github=$(printf '%s\n' "$raw" | awk '{s+=$1} END {print s+0}')
          echo "    GitHub release downloads: $github"

          echo "2/2 Reading Greasy Fork installs..."
          UA="downloads-badge (+https://github.com/${GITHUB_REPOSITORY})"
          greasy=""
          for url in "https://greasyfork.org/scripts/${GREASYFORK_ID}.json" "https://greasyfork.org/en/scripts/${GREASYFORK_ID}.json"; do
            echo "    Trying $url"
            rm -f gf.json
            code=$(curl -sSL -A "$UA" -o gf.json -w '%{http_code}' "$url" || echo "curl-failed")
            echo "    HTTP status: $code"
            if [ "$code" = "200" ] && value=$(jq -er '.total_installs' gf.json 2>/dev/null); then
              greasy="$value"
              break
            fi
            echo "    Response started with: $(head -c 200 gf.json 2>/dev/null || true)"
          done
          if [ -z "$greasy" ]; then
            echo "::error::Could not read the Greasy Fork install count (see the status lines above)."
            exit 1
          fi
          echo "    Greasy Fork installs: $greasy"

          total=$((github + greasy))
          echo "Total: $total"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Publish badge data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"blue"}\n' "${{ steps.count.outputs.total }}" > downloads.json
          git add downloads.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update downloads badge"
            git push origin HEAD:badges
          fi
